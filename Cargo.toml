[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
bimcraft-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
# Deflates PDF streams; png, under tiny-skia, already builds it.
flate2 = "1"
bimcraft-ui-egui = { path = "crates/ui-egui" }
egui = "0.36"
eframe = "0.36"
egui_kittest = "0.36"
rfd = "0.17"
# The system's language, on Windows and macOS too, where no environment variable says it.
sys-locale = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# The 3D view renders in software: build the core optimised in debug builds too, so it orbits smoothly.
[profile.dev.package.bimcraft-core]
opt-level = 2

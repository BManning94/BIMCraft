name: Rebuild patched Windows app
on:
  push:
    branches: [main, "security/harden-untrusted-input"]
    paths: [bimcraft-security.patch, .github/workflows/rebuild-windows.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify previously tested source
        run: |
          $patch = git rev-parse HEAD:bimcraft-security.patch
          if ($patch -ne '271c5c2215f253edb219ebc37f2db019c519b987') { throw 'Patch differs from the one validated in run 39988106892' }
          git diff --exit-code 818967487278dca6ae68e8e1861fc4250e41727a HEAD -- Cargo.toml Cargo.lock apps crates
          if ($LASTEXITCODE -ne 0) { throw 'Source differs from tested baseline' }
      - name: Apply reviewed security changes
        run: |
          git apply --check bimcraft-security.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply bimcraft-security.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
      - name: Rust tools
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all
      - name: Check format
        run: cargo fmt --all --check
      # Identical source passed lint and 1104 tests in run 39988106892.
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p bimcraft -p bimcraft-cli
      - name: Package and smoke test
        shell: pwsh
        run: |
          $bin = 'target/x86_64-pc-windows-msvc/release'
          $desktop = Start-Process -FilePath (Resolve-Path "$bin/bimcraft.exe") -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput desktop-version.txt
          if ($desktop.ExitCode -ne 0) { throw "Desktop smoke test failed: $($desktop.ExitCode)" }
          $versionText = (Get-Content desktop-version.txt -Raw).Trim()
          if ($versionText -ne 'bimcraft 0.7.0') { throw "Unexpected desktop version: $versionText" }
          & "$bin/bimcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke test failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$bin/bimcraft.exe", "$bin/bimcraft-cli.exe" dist/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, bimcraft-security.patch dist/
          Copy-Item crates/rvt/NOTICE dist/REVIT-READER-NOTICE.txt
          Copy-Item docs/security-local-review.md dist/SECURITY-REVIEW.md
          Set-Content dist/BUILD-COMMIT.txt $env:GITHUB_SHA
          Set-Content dist/VALIDATION.txt 'Identical source passed formatting, clippy, and 1104 tests (one ignored) in https://github.com/BManning94/BIMCraft/actions/runs/39988106892 . Cargo audit completed in https://github.com/BManning94/BIMCraft/actions/runs/39989225814 with four unmaintained warnings and one yanked-package warning. Full GUI launch and fuzzing remain unverified. Automatic installation is disabled pending publisher authentication.'
          Get-ChildItem dist/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIMCraft-patched-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
